name: 每日随机刷步数

on:
  schedule:
    # UTC 12:00 = 北京时间 20:00
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: 随机选择北京时间20:00-23:00的执行时刻
        run: |
          now=$(date +%s)
          today=$(TZ=Asia/Shanghai date '+%Y-%m-%d')
          start=$(TZ=Asia/Shanghai date -d "$today 20:00:00" +%s)
          end=$(TZ=Asia/Shanghai date -d "$today 23:00:00" +%s)
          target=$((start + $(shuf -i 0-10799 -n 1)))
          if [ "$now" -ge "$end" ]; then
            echo "当前已超过北京时间23:00，本次跳过，避免窗口外执行。"
            exit 0
          fi
          delay=$((target - now))
          if [ "$delay" -lt 0 ]; then delay=0; fi
          echo "随机执行时刻：$(TZ=Asia/Shanghai date -d "@$target" '+%Y-%m-%d %H:%M:%S')"
          echo "实际等待秒数：$delay"
          sleep "$delay"

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}" || echo "没有需要提交的 Token 变更"
          # 先同步远程提交再推送；若并发工作流抢先推送，则重新同步并重试
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              echo "Token 持久化成功"
              exit 0
            fi
            echo "推送遇到并发更新，第 ${attempt} 次重试"
            sleep 3
          done
          echo "多次尝试后仍无法推送"
          exit 1
